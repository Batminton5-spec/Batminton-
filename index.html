<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap');

:root{
  --bg:#080A0E;
  --panel:#11151C;
  --panel2:#181E27;
  --line:#2A323E;
  --chalk:#E8EAEF;
  --muted:#78838F;
  --accent:#FFD23F;
  --cool:#5A7A9E;
  --warm:#FFD23F;
  --hot:#D6323C;
}
*{box-sizing:border-box}
body{margin:0}
#app{
  font-family:'Barlow',system-ui,sans-serif;
  background:
    radial-gradient(720px 300px at 50% -90px, rgba(255,210,63,.09), transparent 70%),
    var(--bg);
  color:var(--chalk);padding:14px;min-height:100vh;
  font-size:15px;line-height:1.45;
}
.num{font-family:'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}

.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.sess{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;line-height:1;
  background:none;border:none;color:var(--accent);max-width:200px;padding:0;letter-spacing:.02em}
.sess:focus{outline:2px solid var(--accent);outline-offset:3px}
.topstat{color:var(--muted);font-size:14px}
.topstat b{color:var(--chalk);font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600}
.spacer{flex:1}

.hero{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:12px 14px;margin-bottom:14px}
.hero-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.hero-title{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:17px}
.hero-sub{color:var(--muted);font-size:13px}
.nextrow{display:flex;gap:8px;flex-wrap:wrap}
.nextcard{flex:1 1 118px;background:var(--panel2);border-radius:3px;padding:9px 11px;
  border-left:3px solid var(--cool);border-top:1px solid transparent;border-right:1px solid transparent;
  border-bottom:1px solid transparent;cursor:pointer;text-align:left;font:inherit;color:inherit}
.nextcard:hover{border-color:var(--line);border-left-color:inherit}
.nextcard .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextcard .tm{font-family:'Barlow Condensed',sans-serif;font-size:27px;font-weight:600;line-height:1.05}
.nextcard .gm{color:var(--muted);font-size:12px}

.cols{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:880px){.cols{grid-template-columns:1.35fr 1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px}
.phead{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ptitle{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:17px}
.pcount{color:var(--muted);font-size:13px}

/* level chip */
.lv{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;
  padding:1px 5px;border-radius:2px;flex-shrink:0;line-height:1.5;white-space:nowrap}

/* verdict chip */
.vd{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;
  padding:1px 7px;border-radius:2px;white-space:nowrap}

.court{border-bottom:1px solid var(--line);padding:11px 13px}
.court:last-child{border-bottom:none}
.crow{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.cname{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px}
.ctime{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:600;color:var(--accent)}
.ctime.idle{color:var(--muted)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.net{grid-column:1/-1;height:1px;background:repeating-linear-gradient(90deg,var(--line) 0 5px,transparent 5px 9px);margin:2px 0}
.slot{background:var(--panel2);border-radius:3px;padding:7px 9px;display:flex;align-items:center;
  gap:6px;min-height:44px;cursor:pointer;border:1px solid transparent;text-align:left;width:100%;
  color:inherit;font:inherit}
.slot:hover{border-color:var(--line)}
.slot.empty{color:var(--muted);border:1px dashed var(--line);background:transparent;justify-content:center}
.slot .snm{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .sgm{color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:14px}

.bench{max-height:460px;overflow:auto}
.brow{display:flex;align-items:center;gap:8px;padding:7px 13px;border-bottom:1px solid rgba(41,64,56,.5);cursor:pointer}
.brow:hover{background:var(--panel2)}
.bnm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:58px}
.bbarwrap{width:52px;height:7px;background:#05070A;border-radius:2px;overflow:hidden;flex-shrink:0}
.bbar{height:100%;width:0%}
.btm{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600;width:50px;text-align:right;flex-shrink:0}
.bgm{color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:15px;width:22px;text-align:right;flex-shrink:0}

.money{margin-top:14px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:9px;padding:12px 13px}
.mitem label{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}
.mitem input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--chalk);
  border-radius:3px;padding:6px 8px;font-family:'Barlow Condensed',sans-serif;font-size:16px}
.mitem input:focus{outline:2px solid var(--accent);outline-offset:1px}
.msum{display:flex;gap:18px;flex-wrap:wrap;padding:11px 13px;border-top:1px solid var(--line);align-items:baseline}
.msum div span{color:var(--muted);font-size:12px;display:block}
.msum div b{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:600}
.rate b{color:var(--accent)}

.tally{max-height:320px;overflow:auto}
.trow{display:flex;align-items:center;gap:8px;padding:6px 13px;border-bottom:1px solid rgba(41,64,56,.5)}
.trow .tn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tg{color:var(--muted);width:40px;text-align:right;font-family:'Barlow Condensed',sans-serif;font-size:15px}
.trow .tc{width:62px;text-align:right;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:600}
.pay{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:2px;
  padding:2px 6px;font:inherit;font-size:12px;cursor:pointer;width:60px;flex-shrink:0}
.pay.gcash{color:#080A0E;background:var(--accent);border-color:var(--accent)}
.pay.cash{color:#080A0E;background:#9BAABD;border-color:#9BAABD}

button{font-family:'Barlow',sans-serif}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--chalk);border-radius:3px;
  padding:6px 11px;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.go{background:var(--accent);border-color:var(--accent);color:#080A0E;font-weight:600}
.btn.go:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 8px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--hot);border-color:rgba(214,50,60,.45)}
.btn.danger:hover{border-color:var(--hot)}
.link{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;
  text-decoration:underline;text-underline-offset:2px;padding:0}
.link:hover{color:var(--chalk)}
.link.alert{color:var(--accent)}

.veil{position:fixed;inset:0;background:rgba(4,5,8,.82);display:flex;align-items:center;
  justify-content:center;padding:14px;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:3px;width:100%;
  max-width:440px;max-height:86vh;display:flex;flex-direction:column}
.mhead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.mhead .ptitle{flex:1}
.mbody{overflow:auto;padding:4px 0}
.mfoot{padding:11px 14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.pick{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;width:100%;
  background:none;border:none;color:inherit;font:inherit;text-align:left}
.pick:hover{background:var(--panel2)}
.pick .pn{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .pt{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:600}
.pick .pg{color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:16px;
  flex-shrink:0;min-width:24px;text-align:right}
.field{display:flex;gap:8px;padding:10px 14px;align-items:center}
.field input{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--chalk);
  border-radius:3px;padding:7px 9px;font:inherit}
.field input:focus{outline:2px solid var(--accent);outline-offset:1px}
select{background:var(--panel2);border:1px solid var(--line);color:var(--chalk);border-radius:3px;
  padding:4px 6px;font-family:'Barlow',sans-serif;font-size:13px}
.rsec{display:flex;align-items:baseline;gap:6px;padding:11px 14px 3px;
  border-top:1px solid var(--line);margin-top:4px}
.rsec:first-of-type{border-top:none;margin-top:0}
.rsecn{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--accent)}
.rsecl{font-size:12px;color:var(--muted)}
.rrank{display:flex;align-items:center;gap:9px;padding:5px 14px}
.rplace{font-size:17px;font-weight:600;color:var(--muted);min-width:20px;text-align:right}
.rplace.top{color:var(--accent)}
.rname{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:50px}
.rbarwrap{width:56px;height:6px;background:#05070A;border-radius:2px;overflow:hidden;flex-shrink:0}
.rbar{height:100%;background:linear-gradient(90deg,#5A7A9E,var(--accent))}
.rrec{font-size:17px;font-weight:600;width:42px;text-align:right;flex-shrink:0}
.rpct{font-size:14px;color:var(--muted);width:38px;text-align:right;flex-shrink:0}
.req{border-bottom:1px solid var(--line);padding:9px 13px}
.req:last-child{border-bottom:none}
.reqhead{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.reqnames{font-weight:600;font-size:14px;flex:1;min-width:120px}
.reqstat{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;
  padding:1px 6px;border-radius:2px;white-space:nowrap}
.reqnote{font-size:12px;color:var(--muted);margin-top:2px}
.draft{border-bottom:1px solid var(--line);padding:10px 13px}
.draft:last-child{border-bottom:none}
.dhead{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.dname{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;color:var(--muted)}
.dslots{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.dchip{display:flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid transparent;
  border-radius:3px;padding:5px 8px;font:inherit;color:inherit;cursor:pointer;font-size:14px;font-weight:600}
.dchip:hover{border-color:var(--hot)}
.logrow{border-bottom:1px solid var(--line);padding:9px 14px}
.logrow:last-of-type{border-bottom:none}
.loghead{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.logn{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;color:var(--accent)}
.logmeta{font-size:12px;color:var(--muted)}
.logside{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--panel2);
  border:1px solid transparent;border-radius:3px;padding:6px 9px;margin-bottom:4px;color:inherit;
  font:inherit;font-size:14px;cursor:pointer}
.logside:hover{border-color:var(--accent)}
.logside.won{border-color:rgba(255,210,63,.45)}
.logname{flex:1;font-weight:600}
.logwin{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--accent)}
.lognores{font-size:12px;color:var(--muted);padding-top:2px}
.pbtn{background:transparent;border:1px solid var(--line);border-radius:2px;cursor:pointer;
  padding:3px 5px;display:flex;align-items:center;gap:2px;flex-shrink:0}
.pbtn:hover{border-color:var(--accent)}
.pbtn i{display:block;width:2px;height:9px;background:var(--muted)}
.pbtn:hover i{background:var(--accent)}
.pbtn.play i{width:0;height:0;background:transparent;border-left:7px solid var(--accent);
  border-top:5px solid transparent;border-bottom:5px solid transparent}
.pausedhead{color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;
  padding:9px 13px 3px;border-top:1px solid var(--line)}
.prow{display:flex;align-items:center;gap:8px;padding:6px 13px;opacity:.6}
.prow .pn2{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pw{font-family:'Barlow Condensed',sans-serif;font-size:15px;color:var(--muted)}
.ord{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:2px;
  cursor:pointer;font-size:13px;line-height:1;padding:3px 6px;flex-shrink:0}
.ord:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.ord:disabled{opacity:.25;cursor:not-allowed}
.dgames{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;
  color:var(--muted);padding-left:1px}
.dchip.playing .dgames{color:var(--hot);opacity:.8}
.dchip.playing{border-color:rgba(214,50,60,.55);color:var(--hot)}
.dchip.playing .lv{opacity:.75}
.dchip.add{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:400}
.dchip.add:hover{border-color:var(--accent);color:var(--chalk)}
.dvs{color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:15px;padding:0 2px}
.btag{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;color:var(--accent);
  border:1px solid rgba(255,210,63,.4);border-radius:2px;padding:0 4px;flex-shrink:0}
.nextalert{background:transparent;border:1px solid rgba(255,210,63,.55);border-radius:3px;
  color:var(--chalk);font-family:'Barlow',sans-serif;font-size:13px;padding:2px 8px;cursor:pointer}
.nextalert:hover{border-color:var(--accent)}
.reqalert{background:transparent;border:1px solid rgba(95,191,138,.5);border-radius:3px;
  color:var(--chalk);font-family:'Barlow',sans-serif;font-size:13px;padding:2px 8px;cursor:pointer}
.reqalert:hover{border-color:#5FBF8A}
.reqnum{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--muted);
  min-width:13px}
.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;
  vertical-align:middle}
.cfgbox{width:100%;height:150px;background:#05070A;color:var(--chalk);border:1px solid var(--line);
  border-radius:3px;padding:9px;font-family:ui-monospace,monospace;font-size:11px;resize:none}
.sumbox{width:100%;height:260px;background:#05070A;color:var(--chalk);border:1px solid var(--line);
  border-radius:3px;padding:9px;font-family:ui-monospace,monospace;font-size:12px;resize:none}
.note{color:var(--muted);font-size:13px;padding:8px 14px}
.empty-note{color:var(--muted);padding:16px 13px;font-size:14px}
.sechead{color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600;
  padding:10px 14px 4px;border-top:1px solid var(--line);margin-top:4px}
.sechead:first-child{border-top:none;margin-top:0}
.rrow{display:flex;align-items:center;gap:6px;padding:6px 12px}
.rrow select{max-width:118px;flex-shrink:1;min-width:0}
.rrow .rn{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow.dim .rn{color:var(--muted);font-weight:400}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
</style>

<div id="app">
  <div class="top">
    <input class="sess" id="sessName" value="Game #86" aria-label="Session name">
    <div class="topstat">on court <b id="statOn">0</b></div>
    <div class="topstat">waiting <b id="statWait">0</b></div>
    <div class="topstat">games <b id="statGames">0</b></div>
    <div class="topstat">longest wait <b id="statLong">—</b></div>
    <button class="topstat nextalert" id="nextBadge" style="display:none"></button>
    <button class="topstat reqalert" id="reqBadge" style="display:none"></button>
    <div class="topstat" id="syncBadge" style="display:none"></div>
    <div class="spacer"></div>
    <button class="link" id="btnArrivals">Arrivals</button>
    <button class="link" id="btnRoster">Roster</button>
    <button class="link" id="btnFinance">Finance</button>
    <button class="link" id="btnRanks">Rankings</button>
    <button class="link" id="btnLog">Log</button>
    <button class="link" id="btnSummary">Summary</button>
    <button class="link" id="btnSync">Sync</button>
    <button class="link" id="btnReset">Reset</button>
  </div>

  <div class="hero">
    <div class="hero-head">
      <div class="hero-title">Next on</div>
      <div class="hero-sub" id="heroSub">longest off the court</div>
      <div class="spacer"></div>
      <span id="nextVerdict"></span>
      <button class="btn sm" id="btnHeroSort">Longest wait</button>
      <button class="btn go" id="btnSend">Send to court</button>
    </div>
    <div class="nextrow" id="nextRow"></div>
  </div>

  <div class="cols">
    <div>
      <div class="panel">
        <div class="phead">
          <div class="ptitle">Courts</div>
          <div class="pcount" id="courtCount"></div>
          <div class="spacer"></div>
          <button class="btn sm" id="btnMinusCourt">−</button>
          <button class="btn sm" id="btnPlusCourt">+</button>
        </div>
        <div id="courts"></div>
      </div>

      <div class="panel money">
        <div class="phead">
          <div class="ptitle">Up next</div>
          <div class="pcount" id="draftCount"></div>
          <div class="spacer"></div>
          <button class="btn sm" id="btnAutoDraft">Auto-fill all</button>
          <button class="btn sm" id="btnClearDrafts">Clear</button>
          <button class="btn sm" id="btnMinusDraft">−</button>
          <button class="btn sm" id="btnPlusDraft">+</button>
        </div>
        <div id="drafts"></div>
      </div>

      <div class="panel money">
        <div class="phead">
          <div class="ptitle">Requests</div>
          <div class="pcount" id="reqCount"></div>
          <div class="spacer"></div>
          <button class="btn sm" id="btnAddReq">Add</button>
          <button class="btn sm" id="btnToggleReq">Show</button>
        </div>
        <div id="requests"></div>
      </div>

    </div>

    <div>
      <div class="panel">
        <div class="phead">
          <div class="ptitle">Bench</div>
          <div class="pcount" id="benchCount"></div>
          <div class="spacer"></div>
          <button class="btn sm" id="btnSort">Longest wait</button>
        </div>
        <div class="bench" id="bench"></div>
      </div>

      <div class="panel money">
        <div class="phead">
          <div class="ptitle">Tally</div>
          <div class="pcount">games played</div>
        </div>
        <div class="tally" id="tally"></div>
      </div>

      <div class="panel money">
        <div class="phead">
          <div class="ptitle">Money</div>
          <div class="pcount">split by games played</div>
        </div>
        <div class="mgrid">
          <div class="mitem"><label>Courts booked</label><input id="cQty" type="number" min="0" step="1"></div>
          <div class="mitem"><label>Hours</label><input id="cHrs" type="number" min="0" step="0.5"></div>
          <div class="mitem"><label>Rate / court / hr</label><input id="cRate" type="number" min="0" step="10"></div>
          <div class="mitem"><label>Shuttles used</label><input id="sQty" type="number" min="0" step="1"></div>
          <div class="mitem"><label>Price / shuttle</label><input id="sPrice" type="number" min="0" step="5"></div>
          <div class="mitem"><label>Transpo</label><input id="xTrans" type="number" min="0" step="50"></div>
          <div class="mitem"><label>Misc</label><input id="xMisc" type="number" min="0" step="50"></div>
        </div>
        <div class="msum">
          <div><span>total expenses</span><b id="mTotal">0</b></div>
          <div class="rate"><span>per game, per person</span><b id="mRate">0</b></div>
          <div><span>collected</span><b id="mPaid">0</b></div>
          <div><span>unpaid</span><b id="mUnpaid">0</b></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

var HEAT_FULL = 900;
var KEY = "badminton-bench-clock-v2";

/* ---------- levels ---------- */
var LEVELS = [
  {key:"newbie", short:"New",   full:"Newbie",            w:0,   color:"#59636F"},
  {key:"beg",    short:"Beg",   full:"Beginner",          w:2,   color:"#6E7A88"},

function lvIndex(key){
  for(var i=0;i<LEVELS.length;i++){ if(LEVELS[i].key === key) return i; }

/* ---------- match quality ---------- */
var VERDICTS = {
  good:     {label:"Good",     color:"#5FBF8A", rank:3},
  playable: {label:"Playable", color:"#FFD23F", rank:2},
  uneven:   {label:"Uneven",   color:"#D6323C", rank:1}
};
// slots 0,1 = near side; slots 2,3 = far side
// scores on the weighted level scale: how even the sides are, and how far
// apart the strongest and weakest player on court are (the weakest link gets
// targeted every rally, so a wide spread caps the verdict on its own)
function matchScore(ids){
  if(!ids || ids.length !== 4 || ids.indexOf(null) !== -1) return null;
  var v = ids.map(function(id){ return lvWeight(S.players[id].level); });
  return {
    teamDiff: Math.abs((v[0]+v[1]) - (v[2]+v[3])),
    spread: Math.max.apply(null, v) - Math.min.apply(null, v)
  };
}
// Good means the sides are genuinely level: a whole level of difference on one
// player (teamDiff 1) is an edge, not a fair match, so it drops to Playable.
// Level spacing is deliberately uneven: high beginner to low intermediate is a
// short step, low to high intermediate is a long one. The thresholds below are
// read against those weights, not against level positions.
// Mirrored sides are fair by construction: HInt + Beg against HInt + Beg is a
// Good match however wide the range, because each pair faces its own equal.
// Otherwise the two totals must be level, and a wide range drops it to Playable.
function isMirror(ids){
  if(!ids || ids.length !== 4 || ids.indexOf(null) !== -1) return false;
  var w = ids.map(function(id){ return lvWeight(S.players[id].level); });
  var a = [w[0], w[1]].sort(function(x,y){ return x-y; });
  var b = [w[2], w[3]].sort(function(x,y){ return x-y; });
  return a[0] === b[0] && a[1] === b[1];
}
function rateMatch(ids){
  var m = matchScore(ids);
  if(!m) return null;
  if(isMirror(ids)) return VERDICTS.good;       // same pairing on both sides
  if(m.spread >= 5) return VERDICTS.uneven;     // weakest link is outclassed
  if(m.teamDiff >= 1) return VERDICTS.uneven;   // sides are not level
  if(m.spread <= 1.5) return VERDICTS.good;
  return VERDICTS.playable;                     // level sides, wide range on court
}
// finer grain for the auto-picker than the three labels expose
function matchQuality(ids){
  var m = matchScore(ids);
  if(!m) return 0;
  // A mirror stays fair however wide the range, but a newbie facing an advanced
  // player is nobody's good time: keep it legal and rank it last, so the picker
  // only reaches for it when every other option is actually unfair.
  if(isMirror(ids)){
    if(m.spread >= 5) return 2;
    return m.spread <= 1.5 ? 32 : 28;
  }
  if(m.spread >= 5) return -70;
  if(m.teamDiff >= 2) return -60;
  if(m.teamDiff >= 1.5) return -40;
  if(m.teamDiff >= 1) return -25;
  if(m.spread <= 1) return 30;      // dead level, tight range
  if(m.spread <= 1.5) return 26;    // Good
  if(m.spread <= 3) return 14;      // Playable
  return 8;
}
// best way to split 4 players into two pairs
function bestSplit(ids){
  var orders = [[0,1,2,3],[0,2,1,3],[0,3,1,2]];
  var best = null, bestScore = -Infinity;
  orders.forEach(function(o){
    var arranged = o.map(function(i){ return ids[i]; });
    var v = o.map(function(i){ return lvWeight(S.players[ids[i]].level); });
    var d = Math.abs((v[0]+v[1]) - (v[2]+v[3]));
    var spread = Math.max.apply(null, v) - Math.min.apply(null, v);
    var sc = -d + (isMirror(arranged) ? (spread >= 5 ? 5 : 100) : 0);
    if(sc > bestScore){ bestScore = sc; best = arranged; }
  });
  return best;
}

/* ---------- persistence ----------
   Two backends. Inside the Claude app, window.storage exists and is used.
   Opened as a plain .html file in a browser, it falls back to localStorage
   so a refresh does not wipe the session. */
function hasAppStorage(){
  try{ return !!(window.storage && window.storage.get && window.storage.set); }
  catch(e){ return false; }
}
function save(){
  var json;
  try{ json = JSON.stringify(S); }catch(e){ return; }
  if(hasAppStorage()){
    try{ window.storage.set(KEY, json, false).catch(function(){}); }catch(e){}
    return;
  }
  try{ window.localStorage.setItem(KEY, json); }catch(e){}
}
function load(cb){
  if(hasAppStorage()){
    try{
      window.storage.get(KEY, false).then(function(r){
        if(r && r.value){ try{ cb(JSON.parse(r.value)); return; }catch(e){} }
        cb(null);
      }).catch(function(){ cb(null); });
      return;
    }catch(e){}
  }
  try{
    var raw = window.localStorage.getItem(KEY);
    if(raw){ cb(JSON.parse(raw)); return; }
  }catch(e){}
  cb(null);
}

/* ---------- fair, varied auto-pick ---------- */
var IDLE_TOLERANCE = 240;   // seconds: waits within 4 minutes count as equal
var GAME_EQUIV = 360;       // seconds of bench time one game is worth

// Waiting and games played are the same currency here. Someone who has played
// once carries a six-minute handicap against someone who has not, so an early
// arriver with a game already does not get stuck behind every latecomer, but
// does lose the queue to them eventually.
function effWait(p, avgGames){
  return idleOf(p) + (avgGames - p.games) * GAME_EQUIV;
}
function avgGamesOf(list){
  if(!list.length) return 0;
  return list.reduce(function(a, p){ return a + p.games; }, 0) / list.length;
}

function pairKey(a,b){ return a < b ? a + "|" + b : b + "|" + a; }
function metEntry(k){
  var v = S.met ? S.met[k] : null;
  if(v === null || v === undefined) return null;
  if(typeof v === "number") return {n:v, last:0};      // older saves
  return v;
}
function recordMeeting(ids){
  var list = ids.filter(Boolean);
  if(!S.met) S.met = {};
  var g = (S.gamesPlayed || 0) + 1;
  for(var i=0;i<list.length;i++){
    for(var j=i+1;j<list.length;j++){
      var k = pairKey(list[i], list[j]);
      var prev = metEntry(k);
      S.met[k] = {n: (prev ? prev.n : 0) + 1, last: g};
    }
  }
}
// A pairing from twenty games ago should not constrain the picker as hard as one
// from two games ago, so the penalty fades with age.
function metWeight(age){
  if(age <= 6) return 1;
  if(age <= 15) return 0.6;
  return 0.3;
}
function repeatPenalty(ids){
  if(!S.met) return 0;
  var list = ids.filter(Boolean), total = 0;
  var now = S.gamesPlayed || 0;
  for(var i=0;i<list.length;i++){
    for(var j=i+1;j<list.length;j++){
      var e = metEntry(pairKey(list[i], list[j]));
      if(e) total += e.n * metWeight(now - e.last);
    }
  }
  return total;
}

function sampleN(arr, n){
  var c = arr.slice();
  for(var i=c.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = c[i]; c[i] = c[j]; c[j] = t;
  }
  return c.slice(0, n);
}
// picks `need` players from the bench: random within the tolerance window,
// weighted towards balanced matches and away from repeat pairings
function smartPick(need, fixed){
  fixed = (fixed || []).filter(Boolean);
  var pool = autoPool();                      // already ordered longest wait first
  if(pool.length < need){
    // fall back in order: players a request is holding, then players still on court
    var held = availableList().filter(function(p){ return inRequest(p.id); });
    pool = pool.concat(held);
    if(pool.length < need){
      pool = pool.concat(onCourtPool().slice(0, need - pool.length));
    }
    return pool.slice(0, need).map(function(p){ return p.id; });
  }
  if(pool.length === need) return pool.map(function(p){ return p.id; });

  // rank on effective wait, so time on the bench and games played trade off
  var avgGames = avgGamesOf(pool);
  pool = pool.slice().sort(function(a, b){
    return effWait(b, avgGames) - effWait(a, avgGames);
  });

  var edge = effWait(pool[Math.min(need, pool.length) - 1], avgGames) - IDLE_TOLERANCE;
  var cands = pool.filter(function(p){ return effWait(p, avgGames) >= edge; });
  if(cands.length < need) cands = pool.slice(0, need);
  if(cands.length === need) return cands.map(function(p){ return p.id; });

  // if a second court is also empty, judge what this pick leaves behind
  var lookahead = need === 4 && !fixed.length
    && S.courts.filter(function(c){
         return c.slots.filter(function(x){ return x === null; }).length >= 4;
       }).length >= 2
    && cands.length >= 8;

  var best = null, bestScore = -Infinity;
  var tries = Math.min(800, 80 * cands.length);
  for(var t=0;t<tries;t++){
    var pick = sampleN(cands, need);
    var ids = fixed.concat(pick.map(function(p){ return p.id; }));
    var sc = 0;
    if(ids.length === 4) sc += matchQuality(bestSplit(ids));
    sc -= repeatPenalty(ids) * 9;

    // one term covers both: time waited and games already played
    var waited = pick.reduce(function(a,p){ return a + effWait(p, avgGames); }, 0);
    sc += (waited / 60) * 0.4;

    if(lookahead){
      // the four longest waiting of what is left would be the next court
      var taken = {};
      pick.forEach(function(p){ taken[p.id] = 1; });
      var rest = [];
      for(var r=0; r<cands.length && rest.length<4; r++){
        if(!taken[cands[r].id]) rest.push(cands[r].id);
      }
      if(rest.length === 4){
        sc += (matchQuality(bestSplit(rest)) - repeatPenalty(rest) * 9) * 0.5;
      }
    }

    if(sc > bestScore){ bestScore = sc; best = pick; }
  }
  return best.map(function(p){ return p.id; });
}

/* ---------- money ---------- */
function money(){
  var c = S.cost;
  var total = (c.cQty||0)*(c.cHrs||0)*(c.cRate||0) + (c.sQty||0)*(c.sPrice||0)
            + (c.xTrans||0) + (c.xMisc||0);
  var slots = 0, freeSlots = 0, freeHeads = 0;
  S.order.forEach(function(id){
    var p = S.players[id];
    if(p.exempt){
      freeSlots += p.games;
      if(p.games > 0) freeHeads++;
    } else {
      slots += p.games;
    }
  });
  var computed = slots > 0 ? total/slots : 0;
  var fixed = (S.rateOverride === null || S.rateOverride === undefined) ? null : Number(S.rateOverride);
  var rate = (fixed !== null && !isNaN(fixed)) ? fixed : computed;
  var paid = 0, unpaid = 0;
  S.order.forEach(function(id){
    var p = S.players[id];
    if(p.exempt) return;
    var owe = p.games*rate;
    if(p.pay === "unpaid") unpaid += owe; else paid += owe;
  });
  var expected = slots * rate;
  return {total:total, rate:rate, computed:computed, fixed:fixed, slots:slots,
          freeSlots:freeSlots, freeHeads:freeHeads,
          paid:paid, unpaid:unpaid, expected:expected, gap:expected - total};
}

/* ---------- actions ---------- */
function placeOnCourt(court, pid, slotIdx){
  var p = S.players[pid];
  unDraft(pid);
  p.totalIdle += idleOf(p);
  p.benchSince = null;
  court.slots[slotIdx] = pid;
  if(court.slots.every(function(x){ return x !== null; }) && !court.startedAt){
    court.startedAt = Date.now();
  }
}
function sendToCourt(court, ids){
  ids.forEach(function(id){
    var slot = court.slots.indexOf(null);
    if(slot !== -1) placeOnCourt(court, id, slot);
  });
  commit();
}
function endGame(court, winner){
  var now = Date.now();
  court.slots.forEach(function(id, i){
    if(!id) return;
    var p = S.players[id];
    p.games += 1;
    p.benchSince = now;
    if(winner === 0 || winner === 1){
      var side = i < 2 ? 0 : 1;
      if(side === winner) p.wins = (p.wins||0) + 1;
      else p.losses = (p.losses||0) + 1;
    }
  });
  recordMeeting(court.slots);
  if(!S.log) S.log = [];
  S.log.push({
    n: (S.gamesPlayed||0) + 1,
    court: court.n,
    at: now,
    dur: court.startedAt ? Math.round((now - court.startedAt)/1000) : null,
    a: [court.slots[0], court.slots[1]],
    b: [court.slots[2], court.slots[3]],
    won: (winner === 0 || winner === 1) ? winner : null
  });
  court.slots = [null,null,null,null];
  court.startedAt = null;
  S.gamesPlayed = (S.gamesPlayed||0) + 1;
  commit();
}
function pullFromCourt(court, i){
  var id = court.slots[i];
  if(!id) return;
  S.players[id].benchSince = Date.now();
  court.slots[i] = null;
  if(court.slots.every(function(x){ return x === null; })) court.startedAt = null;
  commit();
}
function arrive(p){
  p.status = "in";
  p.paused = false;
  p.benchSince = Date.now();
}
function leave(p){
  var c = onCourt(p.id);
  if(c) c.slots[c.slots.indexOf(p.id)] = null;
  unDraft(p.id);
  p.totalIdle += idleOf(p);
  p.status = "out";
  p.benchSince = null;
}
function commit(){ save(); pushSync(); render(); }

      card.appendChild(foot2);
    } else {
      var t = el("div","tm num",fmt(idleOf(p)));
      t.setAttribute("data-since",p.benchSince); t.setAttribute("data-kind","time");
      card.appendChild(t);
      var foot = el("div","gm");
      foot.appendChild(chip(p));
      foot.appendChild(document.createTextNode(" " + p.games + (p.games===1?" game":" games")));
      card.appendChild(foot);
    }
    nr.appendChild(card);
  });
  var nv = $("nextVerdict"); nv.innerHTML = "";
  if(nextFour.length === 4){
    var v = rateMatch(nextFour.map(function(p){ return p.id; }));
    if(v) nv.appendChild(verdictChip(v));
  }
  var openCourt = openCourtFor(4);
  $("btnSend").disabled = !(openCourt && free.length >= 4);
  $("btnSend").textContent = openCourt ? ("Send to court " + openCourt.n) : "No open court";

  // courts
  var cw = $("courts"); cw.innerHTML = "";
  $("courtCount").textContent = S.courts.length + (S.courts.length===1?" court":" courts");
  S.courts.forEach(function(court){
    var box = el("div","court");
    var row = el("div","crow");
    row.appendChild(el("div","cname","Court " + court.n));
    var ct = el("div", court.startedAt ? "ctime num" : "ctime num idle",
                court.startedAt ? fmt((Date.now()-court.startedAt)/1000) : "\u2014");
    if(court.startedAt){ ct.setAttribute("data-since",court.startedAt); ct.setAttribute("data-kind","time"); }
    row.appendChild(ct);
    var verdict = rateMatch(court.slots);
    if(verdict) row.appendChild(verdictChip(verdict));
    row.appendChild(el("div","spacer"));
    var filled = court.slots.filter(function(x){ return x!==null; }).length;
    if(filled === 4){
      var bal = el("button","btn sm","Even teams");
      bal.onclick = function(){ court.slots = bestSplit(court.slots.slice()); commit(); };
      row.appendChild(bal);
    }
    if(filled > 0){
      var eb = el("button","btn sm go","End game");
      eb.onclick = function(){
        if(filled === 4) askWinner(court);
        else endGame(court, null);
      };
      row.appendChild(eb);
    }
    if(filled === 0){
      var ready = -1;
      S.drafts.forEach(function(dd, i){
        if(ready === -1
           && dd.every(function(x){ return x !== null; })
           && !draftStillPlaying(dd)) ready = i;
      });
      if(ready !== -1){
        var nb2 = el("button","btn sm go","Send Next " + (ready+1));
        nb2.title = "Put the staged lineup on this court";
        nb2.onclick = function(){
          var ids = S.drafts[ready].slice();
          S.drafts.splice(ready, 1);
          S.drafts.push([null,null,null,null]);
          ids.forEach(function(id, i){ if(id) placeOnCourt(court, id, i); });
          commit();
        };
        row.appendChild(nb2);
      }
    }
    if(filled < 4 && autoPool().length){
      var fb = el("button","btn sm","Fill");
      fb.onclick = function(){
        sendToCourt(court, smartPick(4 - filled, court.slots.filter(Boolean)));
      };
      row.appendChild(fb);
    }
    box.appendChild(row);

    var sl = el("div","slots");
    court.slots.forEach(function(id,i){
      if(i === 2) sl.appendChild(el("div","net"));
      var b = document.createElement("button");
      if(id){
        var p = S.players[id];
        b.className = "slot";
        b.appendChild(chip(p));
        b.appendChild(el("div","snm",p.name));
        b.appendChild(el("div","sgm num",p.games));
        var dhold = draftOf(id);
        if(dhold !== -1) b.appendChild(el("span","btag","N" + (dhold+1)));
        b.onclick = function(){
          if(court.startedAt) confirmPull(court, i, p);
          else pullFromCourt(court, i);
        };
        b.title = court.startedAt
          ? p.name + " is mid-game \u2014 tap to take them off"
          : "Tap to send " + p.name + " back to the bench";
      } else {
        b.className = "slot empty";
        b.textContent = "+ add player";
        b.onclick = function(){ pickerFor(court,i); };
      }
      sl.appendChild(b);
    });
    box.appendChild(sl);
    cw.appendChild(box);
  });

  // bench
  var bw = $("bench"); bw.innerHTML = "";
  $("benchCount").textContent = bench.length + " waiting"
    + (pausedCount() ? (" \u00b7 " + pausedCount() + " paused") : "");
  $("btnSort").textContent = S.sort === "wait" ? "Longest wait" : "Fewest games";
  if(!bench.length) bw.appendChild(el("div","empty-note","Empty bench."));
  bench.forEach(function(p){
    var r = el("div","brow");
    r.appendChild(chip(p));
    r.appendChild(el("div","bnm",p.name));
    var wrap = el("div","bbarwrap");
    var bar = el("div","bbar");
    bar.setAttribute("data-since",p.benchSince); bar.setAttribute("data-kind","bar");
    wrap.appendChild(bar); r.appendChild(wrap);
    var t = el("div","btm num",fmt(idleOf(p)));
    t.setAttribute("data-since",p.benchSince); t.setAttribute("data-kind","time");
    r.appendChild(t);
    r.appendChild(el("div","bgm num",p.games));

    var pz = document.createElement("button");
    pz.className = "pbtn";
    pz.appendChild(document.createElement("i"));
    pz.appendChild(document.createElement("i"));
    pz.title = "Pause " + p.name + " \u2014 sitting out for a bit";
    pz.onclick = function(e){
      if(e && e.stopPropagation) e.stopPropagation();
      pausePlayer(p);
      commit();
    };
    r.appendChild(pz);

    var heldBy = requestOf(p.id);
    if(heldBy){
      var rt = el("div","btag","REQ");
      rt.title = "Held for a request with " + heldBy.members.map(function(x){
        return S.players[x] ? S.players[x].name : "?";
      }).join(", ");
      r.appendChild(rt);
    }

    var di = draftOf(p.id);
    if(di !== -1){
      r.appendChild(el("div","btag","N" + (di+1)));
      r.style.opacity = ".62";
      r.title = p.name + " is lined up in Next " + (di+1);
      r.onclick = function(){ unDraft(p.id); commit(); };
    } else {
      r.onclick = function(){ sendPlayerModal(p); };
      r.title = "Tap to send " + p.name + " to a court or a lineup";
    }
    bw.appendChild(r);
  });


  // up next drafts
  var dw = $("drafts"); dw.innerHTML = "";
  $("draftCount").textContent = S.drafts.length
    + (S.drafts.length === 1 ? " lineup \u00b7 send Next 1 first" : " lineups \u00b7 send Next 1 first");
  S.drafts.forEach(function(d, di){
    var box = el("div","draft");
    var head = el("div","dhead");
    head.appendChild(el("div","dname","Next " + (di+1)));

    if(S.drafts.length > 1 && d.filter(Boolean).length){
      var up = el("button","ord","\u2191");
      up.title = "Move this lineup earlier";
      up.disabled = di === 0;
      up.onclick = function(){ moveDraft(di, di-1); };
      head.appendChild(up);

      var dn = el("button","ord","\u2193");
      dn.title = "Move this lineup later";
      dn.disabled = di === S.drafts.length - 1;
      dn.onclick = function(){ moveDraft(di, di+1); };
      head.appendChild(dn);
    }
    var v = rateMatch(d);
    if(v) head.appendChild(verdictChip(v));
    var over = draftOverdue(d);
    if(over > 60){
      var ob = el("span","vd","overdue");
      ob.style.color = "#080A0E";
      ob.style.background = "#E0873A";
      ob.title = "Someone here has waited " + fmt(over) + " longer than the front of the bench";
      head.appendChild(ob);
    }
    head.appendChild(el("div","spacer"));

    var need = d.filter(function(x){ return x === null; }).length;
    if(need > 0 && availableList().length){
      var ab = el("button","btn sm","Auto");
      ab.title = "Fill with the longest waiting";
      ab.onclick = function(){
        var picks = smartPick(need, d.filter(Boolean));
        for(var i=0;i<d.length && picks.length;i++){
          if(d[i] === null) d[i] = picks.shift();
        }
        if(d.filter(Boolean).length === 4) S.drafts[di] = bestSplit(d.slice());
        commit();
      };
      head.appendChild(ab);
    }
    if(need === 0){
      var eb2 = el("button","btn sm","Even teams");
      eb2.title = "Rearrange these four into the fairest pairing";
      eb2.onclick = function(){ S.drafts[di] = bestSplit(d.slice()); commit(); };
      head.appendChild(eb2);
    }
    if(need < 4){
      var cb = el("button","btn sm ghost","Clear");
      cb.onclick = function(){ S.drafts[di] = [null,null,null,null]; commit(); };
      head.appendChild(cb);
    }
    if(need === 0){
      var target = openCourtFor(4);
      var waiting = draftStillPlaying(d);
      var sb = el("button","btn sm go",
        waiting ? "Still playing" : (target ? ("Send to court " + target.n) : "No open court"));
      sb.disabled = !target || waiting;
      if(waiting) sb.title = "Someone in this lineup is still on a court";
      sb.onclick = function(){
        var ids = d.slice();
        S.drafts.splice(di, 1);                       // pull it out of the queue
        S.drafts.push([null,null,null,null]);         // and open a fresh slot at the back
        ids.forEach(function(id, i){ if(id) placeOnCourt(target, id, i); });
        commit();
      };
      head.appendChild(sb);
    }
    box.appendChild(head);

    var row = el("div","dslots");
    d.forEach(function(id, i){
      if(i === 2) row.appendChild(el("div","dvs","vs"));
      var b = document.createElement("button");
      if(id && S.players[id]){
        var p = S.players[id];
        var busy = onCourt(id);
        b.className = busy ? "dchip playing" : "dchip";
        b.appendChild(chip(p));
        b.appendChild(el("span","",p.name));
        var gc = el("span","dgames num", p.games);
        gc.title = p.games + (p.games === 1 ? " game" : " games") + " played";
        b.appendChild(gc);
        b.title = busy
          ? p.name + " is still on court " + busy.n + " \u2014 tap to take them out"
          : "Tap to take " + p.name + " out";
        b.onclick = function(){ d[i] = null; commit(); };
      } else {
        b.className = "dchip add";
        b.textContent = "+ add";
        b.onclick = function(){ draftPicker(di, i); };
      }
      row.appendChild(b);
    });
    box.appendChild(row);
    if(over > 60 && need === 0){
      box.appendChild(el("div","reqnote",
        "Waiting longer than anyone on the bench \u2014 send this one next."));
    }
    dw.appendChild(box);
  });

  var paused = pausedList();
  if(paused.length){
    var ph = el("div","pausedhead","Paused \u2014 " + paused.length);
    bw.appendChild(ph);
    paused.forEach(function(p){
      var r = el("div","prow");
      r.appendChild(chip(p));
      r.appendChild(el("div","pn2",p.name));
      r.appendChild(el("div","pw num", p.games + "g"));
      var pl = document.createElement("button");
      pl.className = "pbtn play";
      pl.appendChild(document.createElement("i"));
      pl.title = "Put " + p.name + " back on the bench";
      pl.onclick = function(){ resumePlayer(p); commit(); };
      r.appendChild(pl);
      bw.appendChild(r);
    });
  }


  // requests
  var rw = $("requests"); rw.innerHTML = "";
  var reqs = S.requests || [];
  var readyN = reqs.filter(function(r){ return reqStatus(r).state === "ready"; }).length;
  var pausedN = reqs.filter(function(r){ return r.paused; }).length;
  $("reqCount").textContent = reqs.length
    ? (reqs.length + (reqs.length === 1 ? " request" : " requests")
       + (readyN ? (" \u00b7 " + readyN + " ready") : "")
       + (pausedN ? (" \u00b7 " + pausedN + " paused") : ""))
    : "none yet";
  $("btnToggleReq").textContent = S.showReq ? "Hide" : "Show";

  // a staged lineup with a court free is the thing most easily forgotten
  var nb = $("nextBadge");
  var sendable = -1;
  S.drafts.forEach(function(d, i){
    if(sendable === -1
       && d.every(function(x){ return x !== null; })
       && !draftStillPlaying(d)
       && openCourtFor(4)) sendable = i;
  });
  if(sendable !== -1){
    nb.style.display = "";
    nb.innerHTML = "";
    var nd = document.createElement("span");
    nd.className = "syncdot";
    nd.style.background = "#FFD23F";
    nb.appendChild(nd);
    nb.appendChild(document.createTextNode("Next " + (sendable+1) + " can go on"));
    nb.title = "Court " + openCourtFor(4).n + " is free and this lineup is complete";
    nb.onclick = function(){
      var t = openCourtFor(4);
      if(!t) return;
      var ids = S.drafts[sendable].slice();
      S.drafts.splice(sendable, 1);
      S.drafts.push([null,null,null,null]);
      ids.forEach(function(id, i){ if(id) placeOnCourt(t, id, i); });
      commit();
    };
  } else {
    nb.style.display = "none";
  }

  var readyIdx = [];
  reqs.forEach(function(r, i){ if(reqStatus(r).state === "ready") readyIdx.push(i+1); });
  var rb = $("reqBadge");
  if(readyIdx.length){
    rb.style.display = "";
    rb.innerHTML = "";
    var rd = document.createElement("span");
    rd.className = "syncdot";
    rd.style.background = "#5FBF8A";
    rb.appendChild(rd);
    rb.appendChild(document.createTextNode(
      (readyIdx.length === 1 ? "request " : "requests ") + readyIdx.join(", ") + " ready"));
    rb.title = "Tap to open the requests panel";
  } else {
    rb.style.display = "none";
  }
  rw.style.display = S.showReq ? "" : "none";

  if(S.showReq){
    if(!reqs.length){
      rw.appendChild(el("div","empty-note","No requests. Add one when a group asks to play together."));
    }
    reqs.forEach(function(r, ri){
      var st = reqStatus(r);
      var box = el("div","req");
      if(r.paused) box.style.opacity = ".6";
      var head = el("div","reqhead");
      head.appendChild(el("div","reqnum num", (ri+1)));
      head.appendChild(el("div","reqnames",
        reqMembers(r).map(function(p){ return p.name; }).join(" + ")));
      var badge = el("span","reqstat",st.label);
      badge.style.color = "#080A0E";
      badge.style.background = st.color;
      head.appendChild(badge);

      if(r.members.length === 4){
        var mv = rateMatch(bestSplit(r.members.slice()));
        if(mv) head.appendChild(verdictChip(mv));
      }

      var openDraft = -1;
      S.drafts.forEach(function(d, i){
        if(openDraft === -1 && d.every(function(x){ return x === null; })) openDraft = i;
      });
      var sb = el("button","btn sm" + (st.state === "ready" ? " go" : ""),
        openDraft === -1 ? "No free lineup" : ("Stage in Next " + (openDraft+1)));
      sb.disabled = openDraft === -1 || st.state === "waiting" || st.state === "broken";
      sb.onclick = function(){ stageRequest(r, openDraft); };
      head.appendChild(sb);

      var ed = el("button","btn sm ghost","Edit");
      ed.title = "Change who is in this request";
      ed.onclick = function(){ requestModal(r); };
      head.appendChild(ed);

      var pz = document.createElement("button");
      if(r.paused){
        pz.className = "pbtn play";
        pz.appendChild(document.createElement("i"));
        pz.title = "Resume this request";
      } else {
        pz.className = "pbtn";
        pz.appendChild(document.createElement("i"));
        pz.appendChild(document.createElement("i"));
        pz.title = "Pause \u2014 these players go back into auto-fill";
      }
      pz.onclick = function(){ r.paused = !r.paused; commit(); };
      head.appendChild(pz);

      var x = el("button","btn sm ghost","\u00d7");
      x.title = "Drop this request";
      x.onclick = function(){
        S.requests = S.requests.filter(function(q){ return q !== r; });
        commit();
      };
      head.appendChild(x);
      box.appendChild(head);

      if(st.state === "paused"){
        box.appendChild(el("div","reqnote",
          "On hold \u2014 these players are back in the normal rotation."));
      } else if(st.state === "ready"){
        box.appendChild(el("div","reqnote","Nobody gets passed over \u2014 run it now."));
      } else if(st.skips){
        box.appendChild(el("div","reqnote",
          st.skips + (st.skips === 1 ? " player ahead of them" : " players ahead of them")
          + " \u00b7 roughly " + st.eta + (st.eta === 1 ? " game away" : " games away")));
      }
      rw.appendChild(box);
    });
  }

  // money + tally
  var m = money();
  ["cQty","cHrs","cRate","sQty","sPrice","xTrans","xMisc"].forEach(function(k){ $(k).value = S.cost[k]; });
  paintMoney(m);

  var tw = $("tally"); tw.innerHTML = "";
  S.order.map(function(id){ return S.players[id]; })
    .filter(function(p){ return p.games > 0 || p.status === "in"; })
    .sort(function(a,b){ return b.games-a.games || a.name.localeCompare(b.name); })
    .forEach(function(p){
      var r = el("div","trow");
      r.appendChild(chip(p));
      r.appendChild(el("div","tn",p.name));
      r.appendChild(el("div","tg num",p.games+"g"));
      if(p.exempt){
        var fb2 = el("div","pay","QM");
        fb2.style.color = "var(--accent)";
        fb2.style.borderColor = "rgba(255,210,63,.4)";
        fb2.style.textAlign = "center";
        r.appendChild(fb2);
        r.style.opacity = ".72";
      }
      tw.appendChild(r);
    });

  tick();
}
function paintMoney(m){
  $("mTotal").textContent = peso(m.total);
  $("mRate").textContent = peso(m.rate);
  var rl = document.querySelector(".rate span");
  if(rl) rl.textContent = (m.fixed !== null && !isNaN(m.fixed))
    ? "per game, per person \u00b7 set" : "per game, per person";
  $("mPaid").textContent = peso(m.paid);
  $("mUnpaid").textContent = peso(m.unpaid);
}
function tick(){
  var now = Date.now();
  document.querySelectorAll("[data-since]").forEach(function(n){
    var since = parseInt(n.getAttribute("data-since"),10);
    if(!since) return;
    var sec = (now - since)/1000;
    var kind = n.getAttribute("data-kind");
    if(kind === "time") n.textContent = fmt(sec);
    else if(kind === "timesuffix") n.textContent = " " + fmt(sec) + " waiting";
    else { n.style.width = Math.min(100,(sec/HEAT_FULL)*100)+"%"; n.style.background = heat(sec); }
  });
  var b = benchList();
  $("statLong").textContent = b.length ? fmt(idleOf(b[0])) : "\u2014";
}

/* ---------- picker ---------- */
function quickSend(pid){
  var court = S.courts.find(function(c){ return c.slots.indexOf(null) !== -1; });
  if(!court) return;
  sendToCourt(court,[pid]);
}
function pickerFor(court, slotIdx){
  var bench = availableList();
  modal("Court " + court.n + " \u2014 pick a player", function(body, foot, close){
    if(!bench.length){ body.appendChild(el("div","note","Nobody is waiting.")); return; }
    bench.forEach(function(p){
      var b = document.createElement("button");
      b.className = "pick";
      b.appendChild(chip(p));
      b.appendChild(el("div","pn",p.name));
      var g = el("div","pg num", p.games + "g");
      g.title = p.games + (p.games === 1 ? " game" : " games") + " played";
      b.appendChild(g);
      var trial = court.slots.slice(); trial[slotIdx] = p.id;
      var v = rateMatch(trial);
      if(v) b.appendChild(verdictChip(v));
      var t = el("div","pt num",fmt(idleOf(p)));
      t.style.color = heat(idleOf(p));
      b.appendChild(t);
      b.onclick = function(){ placeOnCourt(court, p.id, slotIdx); close(); commit(); };
      body.appendChild(b);
    });
  });
}

function draftPicker(di, slotIdx){
  var pool = availableList();
  var busy = onCourtPool();
  modal("Next " + (di+1) + " \u2014 pick a player", function(body, foot, close){
    if(!pool.length && !busy.length){
      body.appendChild(el("div","note","Everyone is already lined up."));
      return;
    }

    function addRow(p, playing){
      var b = document.createElement("button");
      b.className = "pick";
      b.appendChild(chip(p));
      var nm = el("div","pn",p.name);
      if(playing) nm.style.color = "var(--hot)";
      b.appendChild(nm);
      b.appendChild(el("div","pg num", p.games + "g"));
      var trial = S.drafts[di].slice(); trial[slotIdx] = p.id;
      var v = rateMatch(trial);
      if(v) b.appendChild(verdictChip(v));
      var t = el("div","pt num", playing ? "on court" : fmt(idleOf(p)));
      t.style.color = playing ? "var(--hot)" : heat(idleOf(p));
      if(playing) t.style.fontSize = "14px";
      b.appendChild(t);
      b.onclick = function(){ S.drafts[di][slotIdx] = p.id; close(); commit(); };
      body.appendChild(b);
    }

    if(pool.length){
      body.appendChild(el("div","sechead","On the bench"));
      pool.forEach(function(p){ addRow(p, false); });
    }
    if(busy.length){
      body.appendChild(el("div","sechead","Still playing"));
      body.appendChild(el("div","note",
        "You can line these up now, but the draft cannot be sent until their game ends."));
      busy.forEach(function(p){ addRow(p, true); });
    }
  });
}

function sendPlayerModal(p){
  modal(p.name + " \u2014 send where?", function(body, foot, close){
    var any = false;

    var openCourts = S.courts.filter(function(c){ return c.slots.indexOf(null) !== -1; });
    openCourts.sort(function(x,y){
      var tx = x.slots.slice(); tx[tx.indexOf(null)] = p.id;
      var ty = y.slots.slice(); ty[ty.indexOf(null)] = p.id;
      return matchQuality(ty) - matchQuality(tx);
    });
    if(openCourts.length){
      any = true;
      body.appendChild(el("div","sechead","Courts"));
      openCourts.forEach(function(c){
        var freeSlots = c.slots.filter(function(x){ return x === null; }).length;
        var b = document.createElement("button");
        b.className = "pick";
        b.appendChild(el("div","pn","Court " + c.n));
        var trial = c.slots.slice();
        trial[trial.indexOf(null)] = p.id;
        var v = rateMatch(trial);
        if(v) b.appendChild(verdictChip(v));
        var t = el("div","pt num", freeSlots + " free");
        t.style.fontSize = "15px";
        t.style.color = "var(--muted)";
        b.appendChild(t);
        b.onclick = function(){
          placeOnCourt(c, p.id, c.slots.indexOf(null));
          close(); commit();
        };
        body.appendChild(b);
      });
    }

    var openDrafts = [];
    S.drafts.forEach(function(d, di){
      if(d.indexOf(null) !== -1) openDrafts.push({d:d, i:di});
    });
    openDrafts.sort(function(x,y){
      var tx = x.d.slice(); tx[tx.indexOf(null)] = p.id;
      var ty = y.d.slice(); ty[ty.indexOf(null)] = p.id;
      return matchQuality(ty) - matchQuality(tx);
    });
    if(openDrafts.length){
      any = true;
      body.appendChild(el("div","sechead","Up next"));
      openDrafts.forEach(function(o){
        var freeSlots = o.d.filter(function(x){ return x === null; }).length;
        var b = document.createElement("button");
        b.className = "pick";
        b.appendChild(el("div","pn","Next " + (o.i+1)));
        var trial = o.d.slice();
        trial[trial.indexOf(null)] = p.id;
        var v = rateMatch(trial);
        if(v) b.appendChild(verdictChip(v));
        var t = el("div","pt num", freeSlots + " free");

/* ---------- requests ---------- */
// A request is a group who asked to play together. The question is not whether
// to honour it but when: running it early means passing over people who have
// waited longer. reqStatus measures exactly that cost.
function reqMembers(r){
  return r.members.map(function(id){ return S.players[id]; }).filter(Boolean);
}
// Readiness measures one thing: how many people would be passed over if this
// request went on now. It reads the queue the same way you are sorting it, and
// it forgives differences inside the tolerance window, so it agrees with what
// the bench shows. The count falls by roughly four per game, which is where the
// "about N games" estimate comes from.
function reqStatus(r){
  var mem = reqMembers(r);
  if(mem.length < 2) return {state:"broken", label:"needs 2+", color:"var(--muted)"};
  if(r.paused) return {state:"paused", label:"paused", color:"var(--muted)"};

  var away = mem.filter(function(p){
    return p.status !== "in" || p.paused || onCourt(p.id);
  });
  if(away.length){
    return {state:"waiting", color:"var(--muted)",
      label: away.length === 1 ? away[0].name + " not free" : away.length + " not free"};
  }

  var ids = mem.map(function(p){ return p.id; });
  var bench = benchList();                       // sorted by whichever mode is on
  var mine = bench.filter(function(p){ return ids.indexOf(p.id) !== -1; });
  if(mine.length !== mem.length){
    return {state:"waiting", label:"not all free", color:"var(--muted)"};
  }
  var last = mine[mine.length - 1];               // member furthest back in the queue

  var byGames = S.sort === "games";
  var ahead = bench.filter(function(p){
    if(ids.indexOf(p.id) !== -1) return false;
    return byGames
      ? p.games < last.games                      // fewer games played = ahead of them
      : idleOf(p) > idleOf(last) + IDLE_TOLERANCE; // a clear wait, not a near tie
  }).length;

  var fromQueue = Math.max(0, 4 - mem.length);    // spare slots go to the front anyway
  var skips = Math.max(0, ahead - fromQueue);
  var eta = Math.ceil(skips / 4);                 // four leave the bench per game

  if(skips === 0) return {state:"ready", label:"ready", color:"#5FBF8A", skips:0, eta:0};
  if(eta <= 1) return {state:"soon", label:"about 1 game", color:"#FFD23F", skips:skips, eta:1};
  return {state:"early", label:"about " + eta + " games", color:"#E0873A",
          skips:skips, eta:eta};
}

function readyRequest(){
  var best = null, bestSkips = 1e9;
  (S.requests || []).forEach(function(r){
    if(r.paused) return;
    var st = reqStatus(r);
    if(st.state === "ready" && st.skips < bestSkips){ bestSkips = st.skips; best = r; }
  });
  return best;
}
// put a request into a lineup, topping up any spare slots from the queue
function stageRequest(r, di){
  var mem = reqMembers(r).filter(function(p){ return !onCourt(p.id); });
  var d = [null,null,null,null], i = 0;
  mem.slice(0,4).forEach(function(p){ unDraft(p.id); d[i++] = p.id; });
  if(i < 4){
    var fill = smartPick(4 - i, d.filter(Boolean));
    fill.forEach(function(id){ if(i < 4) d[i++] = id; });
  }
  S.drafts[di] = bestSplit(d.slice());
  S.requests = S.requests.filter(function(x){ return x !== r; });
  commit();
}
function requestModal(existing){
  var chosen = existing ? existing.members.slice() : [];
  modal(existing ? "Edit request" : "New request", function(body, foot, close){
    body.appendChild(el("div","note",
      "Pick 2 to 4 players who asked to play together. Only people who have arrived and are not paused are listed."));
    var listWrap = el("div","");
    body.appendChild(listWrap);

    var save = el("button","btn go","Save");
    save.onclick = function(){
      if(chosen.length < 2) return;
      if(existing) existing.members = chosen.slice();
      else S.requests.push({id:"r"+Date.now(), members:chosen.slice(), at:Date.now()});
      S.showReq = true;
      close(); commit();
    };
    foot.appendChild(save);

    if(existing){
      var drop = el("button","btn danger","Delete request");
      drop.onclick = function(){
        S.requests = S.requests.filter(function(q){ return q !== existing; });
        close(); commit();
      };
      foot.appendChild(drop);
    }

    function paint(){
      listWrap.innerHTML = "";
      save.disabled = chosen.length < 2;
      save.textContent = chosen.length
        ? ((existing ? "Save changes (" : "Save request (") + chosen.length + ")")
        : (existing ? "Save changes" : "Save request");

      // available players, plus anyone already chosen so they can be taken out
      var listed = S.order.map(function(id){ return S.players[id]; })
        .filter(function(p){
          return (p.status === "in" && !p.paused) || chosen.indexOf(p.id) !== -1;
        })
        .sort(function(a,b){ return a.name.localeCompare(b.name); });

      if(!listed.length){
        listWrap.appendChild(el("div","empty-note","Nobody has arrived yet."));
        return;
      }

      listed.forEach(function(p){
        var on = chosen.indexOf(p.id) !== -1;
        var away = !(p.status === "in" && !p.paused);
        var b = document.createElement("button");
        b.className = "pick";
        b.appendChild(chip(p));
        var nm = el("div","pn",p.name);
        if(on) nm.style.color = "var(--accent)";
        b.appendChild(nm);
        if(away){
          var w = el("div","pg", p.status === "out" ? "left" : "paused");
          w.style.color = "var(--hot)";
          w.style.fontSize = "12px";
          b.appendChild(w);
        }
        b.appendChild(el("div","pt num", on ? "\u2713" : ""));
        b.onclick = function(){
          if(on) chosen = chosen.filter(function(x){ return x !== p.id; });
          else if(chosen.length < 4) chosen.push(p.id);
          paint();
        };
        listWrap.appendChild(b);
      });
    }
    paint();
  });
}

/* ---------- game log ---------- */
function applyResult(entry, winner, sign){
  if(winner !== 0 && winner !== 1) return;
  var winners = winner === 0 ? entry.a : entry.b;
  var losers  = winner === 0 ? entry.b : entry.a;
  winners.forEach(function(id){
    var p = S.players[id];
    if(p) p.wins = Math.max(0, (p.wins||0) + sign);
  });
  losers.forEach(function(id){
    var p = S.players[id];
    if(p) p.losses = Math.max(0, (p.losses||0) + sign);
  });
}
function setWinner(entry, winner){
  if(entry.won === winner) return;
  applyResult(entry, entry.won, -1);
  entry.won = winner;
  applyResult(entry, winner, +1);
  commit();
}
function sideLabel(ids){
  return ids.filter(Boolean).map(function(id){
    return S.players[id] ? S.players[id].name : "?";
  }).join(" & ") || "\u2014";
}

/* ---------- rankings ---------- */
function ranksModal(){
  modal("Rankings", function(body, foot, close){
    var played = S.order.map(function(id){ return S.players[id]; })
      .filter(function(p){ return (p.wins||0) + (p.losses||0) > 0; });

    if(!played.length){
      body.appendChild(el("div","empty-note",
        "No results recorded yet. Pick a winning side when you end a game and the board fills up."));
      return;
    }

    played.sort(function(a,b){
      var w = (b.wins||0) - (a.wins||0);
      if(w) return w;
      var l = (a.losses||0) - (b.losses||0);
      if(l) return l;
      return a.name.localeCompare(b.name);
    });

    // place: identical records share one. win count drives the section headers.
    var rank = 0, prevKey = null, prevWins = null;
    body.appendChild(el("div","note",
      played.length + " players with results \u00b7 ranked by wins, then fewest losses"));

    played.forEach(function(p){
      var wins = p.wins||0, losses = p.losses||0;
      var key = wins + "/" + losses;
      if(key !== prevKey){ rank++; prevKey = key; }

      if(wins !== prevWins){
        var h = el("div","rsec");
        h.appendChild(el("span","rsecn num", wins));
        h.appendChild(el("span","rsecl", wins === 1 ? "win" : "wins"));
        body.appendChild(h);
        prevWins = wins;
      }

      var total = wins + losses;
      var pct = total ? Math.round(wins/total*100) : 0;
      var row = el("div","rrank");

      var pl = el("div","rplace num", rank);
      if(rank <= 3) pl.classList.add("top");
      row.appendChild(pl);
      row.appendChild(el("div","rname", p.name));

      var bar = el("div","rbarwrap");
      var fill = el("div","rbar");
      fill.style.width = pct + "%";
      bar.appendChild(fill);
      row.appendChild(bar);

      var rec = el("div","rrec num", wins + "\u2013" + losses);
      row.appendChild(rec);
      row.appendChild(el("div","rpct num", pct + "%"));
      body.appendChild(row);
    });

    var noRes = S.order.map(function(id){ return S.players[id]; })
      .filter(function(p){ return p.games > 0 && (p.wins||0) + (p.losses||0) === 0; }).length;
    if(noRes){
      body.appendChild(el("div","note",
        noRes + (noRes === 1 ? " player has" : " players have")
        + " games with no recorded result, so they are not on the board."));
    }
  });
}

/* ---------- summary ---------- */
function summaryModal(){
  var m = money();
  var lines = [];
  lines.push(S.name + "  \u2014  " + new Date(S.startedAt).toLocaleDateString());
  lines.push("");
  lines.push("Player\tLevel\tGames\tWon\tLost\tWaited\tOwed\tPaid");
  S.order.map(function(id){ return S.players[id]; })
    .sort(function(a,b){ return a.name.localeCompare(b.name); })
    .forEach(function(p){
      lines.push([p.name, lvOf(p).full, p.games, p.wins||0, p.losses||0,
                  fmt(p.totalIdle+idleOf(p)),
                  p.exempt ? 0 : Math.round(p.games*m.rate),
                  p.exempt ? "QM" : p.pay].join("\t"));
    });
  lines.push("");
  lines.push("Games played\t" + (S.gamesPlayed||0));
  lines.push("Total expenses\t" + Math.round(m.total));
  lines.push("Player-games\t" + m.slots);
  lines.push("Per game per person\t" + m.rate.toFixed(2)
    + ((m.fixed !== null && !isNaN(m.fixed)) ? "\t(flat rate)" : "\t(expenses split)"));
  lines.push("Unpaid\t" + Math.round(m.unpaid));

  modal("Session summary", function(body, foot, close){
    body.appendChild(el("div","note","Tab-separated. Select all and paste into your sheet."));
    var ta = document.createElement("textarea");
    ta.className = "sumbox"; ta.value = lines.join("\n");
    var wrap = el("div","field"); wrap.appendChild(ta);
    body.appendChild(wrap);
    body.appendChild(el("div","note",
      hasAppStorage()
        ? "Saving inside the Claude app."
        : "Saving to this browser. Clearing site data or private browsing will lose it \u2014 take a backup if the night matters."));
    var sb = el("button","btn","Select all");
    sb.onclick = function(){ ta.focus(); ta.select(); };
    foot.appendChild(sb);

    var dl = el("button","btn","Download backup");
    dl.onclick = function(){
      try{
        var blob = new Blob([JSON.stringify(S)], {type:"application/json"});
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = (S.name || "session").replace(/[^\w#-]+/g,"_") + ".json";
        document.body.appendChild(a); a.click();
        setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1000);
      }catch(e){}
    };
    foot.appendChild(dl);

    var lbl = document.createElement("label");
    lbl.className = "btn";
    lbl.textContent = "Restore backup";
    lbl.style.cursor = "pointer";
    var fi = document.createElement("input");
    fi.type = "file"; fi.accept = "application/json,.json"; fi.style.display = "none";
    fi.onchange = function(){
      var f = fi.files && fi.files[0];
      if(!f) return;
      var rd = new FileReader();
      rd.onload = function(){
        try{
          var obj = JSON.parse(rd.result);
          if(obj && obj.players && obj.order){ S = obj; close(); commit(); }
        }catch(e){}
      };
      rd.readAsText(f);
    };
    lbl.appendChild(fi);
    foot.appendChild(lbl);
  });
}

/* ---------- live sync (optional) ---------- */
var SYNC_KEY = "badminton-sync-config-v1";
var sync = {on:false, ref:null, me:null, status:"off", room:"", err:""};

function myId(){
  if(!sync.me){
    sync.me = "d" + Math.random().toString(36).slice(2,8);
  }
  return sync.me;
}
function loadSyncConfig(){
  try{
    var raw = window.localStorage.getItem(SYNC_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveSyncConfig(cfg){
  try{
    if(cfg) window.localStorage.setItem(SYNC_KEY, JSON.stringify(cfg));
    else window.localStorage.removeItem(SYNC_KEY);
  }catch(e){}
}
function loadScript(src){
  return new Promise(function(res, rej){
    var t = document.createElement("script");
    t.src = src; t.onload = res; t.onerror = function(){ rej(new Error("could not load " + src)); };
    document.head.appendChild(t);
  });
}
function setSyncStatus(st, err){
  sync.status = st; sync.err = err || "";
  var b = document.getElementById("syncBadge");
  if(!b) return;
  if(st === "off"){ b.style.display = "none"; return; }
  b.style.display = "";
  b.innerHTML = "";
  var dot = document.createElement("span");
  dot.className = "syncdot";
  dot.style.background = st === "live" ? "#5FBF8A" : (st === "connecting" ? "#FFD23F" : "#D6323C");
  b.appendChild(dot);
  b.appendChild(document.createTextNode(
    st === "live" ? ("live \u00b7 " + sync.room)
    : st === "connecting" ? "connecting" : "sync error"));
}
function startSync(cfg){
  if(!cfg || !cfg.config || !cfg.room) return;
  setSyncStatus("connecting");
  var base = "https://www.gstatic.com/firebasejs/10.12.2/";
  var boot = (window.firebase && window.firebase.database)
    ? Promise.resolve()
    : loadScript(base + "firebase-app-compat.js").then(function(){
        return loadScript(base + "firebase-database-compat.js");
      });
  boot.then(function(){
    if(!window.firebase.apps || !window.firebase.apps.length){
      window.firebase.initializeApp(cfg.config);
    }
    sync.room = cfg.room;
    sync.ref = window.firebase.database().ref("rooms/" + cfg.room);
    sync.on = true;
    sync.ref.on("value", function(snap){
      var v = snap.val();
      if(!v){ pushSync(); setSyncStatus("live"); return; }
      setSyncStatus("live");
      if(v.by === myId()) return;              // our own echo
      if(!v.blob) return;
      try{
        var incoming = JSON.parse(v.blob);
        if(incoming && incoming.players && incoming.order){
          S = incoming;
          save();
          render();
        }
      }catch(e){}
    }, function(e){ setSyncStatus("error", e && e.message); });
  }).catch(function(e){
    sync.on = false;
    setSyncStatus("error", e && e.message);
  });
}
function stopSync(){
  try{ if(sync.ref) sync.ref.off(); }catch(e){}
  sync.ref = null; sync.on = false; sync.room = "";
  setSyncStatus("off");
}
function pushSync(){
  if(!sync.on || !sync.ref) return;
  try{
    sync.ref.set({blob: JSON.stringify(S), at: Date.now(), by: myId()});
  }catch(e){}
}

function syncModal(){
  modal("Live sync", function(body, foot, close){
    var cfg = loadSyncConfig() || {room:"", config:null, raw:""};
    body.appendChild(el("div","note",
      "Two phones running the same queue. Both need the same Firebase details and the same room code."));

    var f1 = el("div","field");
    var room = document.createElement("input");
    room.placeholder = "Room code, e.g. tuesday-night";
    room.value = cfg.room || "";
    f1.appendChild(room);
    body.appendChild(f1);

    body.appendChild(el("div","note","Paste the firebaseConfig object from your Firebase project:"));
    var ta = document.createElement("textarea");
    ta.className = "cfgbox";
    ta.placeholder = '{ "apiKey": "...", "databaseURL": "https://...firebasedatabase.app", "projectId": "..." }';
    ta.value = cfg.raw || "";
    var wrap = el("div","field"); wrap.appendChild(ta);
    body.appendChild(wrap);

    var msg = el("div","note","");
    body.appendChild(msg);
    if(sync.status === "error" && sync.err) msg.textContent = "Last error: " + sync.err;
    else if(sync.status === "live") msg.textContent = "Connected to room " + sync.room + ".";

    var go = el("button","btn go", sync.on ? "Reconnect" : "Connect");
    go.onclick = function(){
      var r = room.value.trim().toLowerCase().replace(/[^a-z0-9-]+/g,"-");
      if(!r){ msg.textContent = "Give the room a code first."; return; }
      var parsed;
      try{
        var txt = ta.value.trim()
          .replace(/^const\s+firebaseConfig\s*=\s*/,"")
          .replace(/;\s*$/,"")
          .replace(/([{,]\s*)([A-Za-z0-9_]+)\s*:/g,'$1"$2":')
          .replace(/'/g,'"');
        parsed = JSON.parse(txt);
      }catch(e){ msg.textContent = "That config did not parse. Paste the whole { ... } block."; return; }
      if(!parsed.databaseURL){
        msg.textContent = "No databaseURL in that config \u2014 make sure Realtime Database is turned on.";
        return;
      }
      var out = {room:r, config:parsed, raw:ta.value.trim()};
      saveSyncConfig(out);
      stopSync();
      startSync(out);
      close();
    };
    foot.appendChild(go);

    if(sync.on){
      var off = el("button","btn danger","Disconnect");
      off.onclick = function(){ stopSync(); close(); };
      foot.appendChild(off);
    }
    var clear = el("button","btn ghost","Forget settings");
    clear.onclick = function(){ saveSyncConfig(null); stopSync(); close(); };
    foot.appendChild(clear);
  });
}

/* ---------- modal shell ---------- */
function modal(title, build){
  var veil = el("div","veil");
  var box = el("div","modal");
  var head = el("div","mhead");
  head.appendChild(el("div","ptitle",title));
  head.appendChild(el("div","spacer"));
  var x = el("button","btn sm","Close");
  head.appendChild(x);
  var body = el("div","mbody"), foot = el("div","mfoot");
  box.appendChild(head); box.appendChild(body); box.appendChild(foot);
  veil.appendChild(box);
  function close(){ if(veil.parentNode) veil.parentNode.removeChild(veil); }
  x.onclick = close;
  veil.onclick = function(e){ if(e.target === veil) close(); };
  build(body, foot, close);
  if(!foot.childNodes.length) foot.style.display = "none";
  $("app").appendChild(veil);
}

/* ---------- wiring ---------- */
function wire(){
  $("btnSend").onclick = function(){
    var court = openCourtFor(4);
    if(!court) return;
    sendToCourt(court, availableList().slice(0,4).map(function(p){ return p.id; }));
  };
  function flipSort(){ S.sort = S.sort === "wait" ? "games" : "wait"; commit(); }
  $("btnSort").onclick = flipSort;
  $("btnHeroSort").onclick = flipSort;
  $("btnAutoDraft").onclick = function(){
    var r = readyRequest();
    if(r){
      var slot = -1;
      S.drafts.forEach(function(d, i){
        if(slot === -1 && d.every(function(x){ return x === null; })) slot = i;
      });
      if(slot !== -1){ stageRequest(r, slot); }
    }
    S.drafts.forEach(function(d, di){
      var need = d.filter(function(x){ return x === null; }).length;
      if(!need) return;
      var picks = smartPick(need, d.filter(Boolean));
      for(var i=0;i<d.length && picks.length;i++){
        if(d[i] === null) d[i] = picks.shift();
      }
      if(d.filter(Boolean).length === 4) S.drafts[di] = bestSplit(d.slice());
    });
    commit();
  };
  $("btnPlusDraft").onclick = function(){
    if(S.drafts.length >= 6) return;
    S.drafts.push([null,null,null,null]);
    commit();
  };
  $("btnMinusDraft").onclick = function(){
    if(S.drafts.length <= 1) return;
    S.drafts.pop();
    commit();
  };
  $("btnAddReq").onclick = addRequestModal;
  $("reqBadge").onclick = function(){ S.showReq = true; commit(); };
  $("btnToggleReq").onclick = function(){ S.showReq = !S.showReq; commit(); };
  $("btnClearDrafts").onclick = function(){
    S.drafts = S.drafts.map(function(){ return [null,null,null,null]; });
    commit();
  };
  $("btnArrivals").onclick = arrivalsModal;
  $("btnRoster").onclick = rosterModal;
  $("btnFinance").onclick = financeModal;
  $("btnRanks").onclick = ranksModal;
  $("btnLog").onclick = logModal;
  $("btnSummary").onclick = summaryModal;
  $("btnSync").onclick = syncModal;
  $("btnReset").onclick = function(){
    modal("Reset session", function(body, foot, close){
      body.appendChild(el("div","note",
        "Clears games, timers and payments, and sends everyone back to not arrived. Roster and levels stay."));
      var soft = el("button","btn go","Reset session");
      soft.onclick = function(){
        S.startedAt = Date.now(); S.gamesPlayed = 0;
        S.courts.forEach(function(c){ c.slots=[null,null,null,null]; c.startedAt=null; });
        S.drafts = S.drafts.map(function(){ return [null,null,null,null]; });
        S.met = {};
        S.log = [];
        S.requests = [];
        S.order.forEach(function(id){
          var p = S.players[id];
          p.games=0; p.wins=0; p.losses=0; p.totalIdle=0; p.pay="unpaid"; p.status="notyet"; p.benchSince=null; p.paused=false;
        });
        close(); commit();
      };
      var hard = el("button","btn danger","Start over from the default roster");
      hard.onclick = function(){ S = freshState(); close(); commit(); };
      foot.appendChild(soft); foot.appendChild(hard);
    });
  };
  $("btnPlusCourt").onclick = function(){
    if(S.courts.length >= 8) return;
    S.courts.push(mkCourt(S.courts.length+1)); commit();
  };
  $("btnMinusCourt").onclick = function(){
    if(S.courts.length <= 1) return;
    var c = S.courts[S.courts.length-1];
    c.slots.forEach(function(id){ if(id) S.players[id].benchSince = Date.now(); });
    S.courts.pop(); commit();
  };
  $("sessName").oninput = function(){ S.name = this.value; save(); };
  ["cQty","cHrs","cRate","sQty","sPrice","xTrans","xMisc"].forEach(function(k){
    $(k).oninput = function(){
      S.cost[k] = parseFloat(this.value) || 0;
      paintMoney(money()); save();
    };
    $(k).onblur = function(){ render(); };
  });
}

/* ---------- boot ---------- */
load(function(saved){
  if(saved && saved.players && saved.order){
    S = saved;
    var max = 1;
    S.order.forEach(function(id){
      var n = parseInt(String(id).replace("p",""),10);
      if(n >= max) max = n+1;
      var p = S.players[id];
      if(!p.level) p.level = "lint";
      if(!p.status) p.status = "notyet";
      if(typeof p.wins !== "number") p.wins = 0;
      if(typeof p.paused !== "boolean") p.paused = false;
      if(typeof p.exempt !== "boolean") p.exempt = false;
      if(typeof p.losses !== "number") p.losses = 0;
    });
    uid = max;
    if(!S.met) S.met = {};
    if(!S.log) S.log = [];
    if(!S.requests) S.requests = [];
    if(!S.drafts || !S.drafts.length){
      S.drafts = [[null,null,null,null],[null,null,null,null],[null,null,null,null]];
    }
  } else {
    S = freshState();
  }
  wire(); render();
  setInterval(tick, 1000);
  var sc = loadSyncConfig();
  if(sc && sc.room && sc.config) startSync(sc);
});

})();
